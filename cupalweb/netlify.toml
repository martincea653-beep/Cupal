# ==============================================================================
# CONFIGURACIÓN DE PUBLICACIÓN EN NETLIFY - CUPAL RESTOBAR & CAFETERÍA
# ==============================================================================

[build]
  # Directorio raíz a publicar (sitio estático HTML/CSS/JS de alto rendimiento)
  publish = "."

# Encabezados de seguridad, rendimiento y caché para optimizar la velocidad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caché agresivo para imágenes estáticas (logo, fotos)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caché óptimo para estilos y scripts
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
